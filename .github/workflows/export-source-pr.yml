name: Export Source PR

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  export-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Upload source artifact
        uses: actions/upload-artifact@v4
        with:
          name: inkthreadhub-source-pr
          path: |
            .
            !.git
            !node_modules
          include-hidden-files: true
          retention-days: 1
